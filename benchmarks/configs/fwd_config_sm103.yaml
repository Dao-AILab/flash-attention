# Explicit old-vs-new config comparisons for the four SM103 BF16 policies.
# Adding another campaign means adding an experiment/grid here; the runner emits
# n, geomean with paired-round 95% timing interval, time-weighted gain,
# min/max, and W/N/L.
settings:
  dtype: bfloat16
  seed: 0
  workers: 16
  rounds: 7
  iters_per_round: 31
  warmup_iters: 10
  clock_warmup_iters: 20

experiments:
  - name: long_k_d64_nonpersistent
    baseline: {is_persistent: true}
    candidate: {is_persistent: false}
    correctness:
      mode: dense
      q_heads: 16
      kv_heads: 4
      head_dim: 64
      batch: 1
      seqlen_q: 65
      seqlen_k: 4096
      causal: false
    grids:
      - phase: boundary
        mode: dense
        head_pairs: [[16, 16], [16, 4]]
        head_dims: [64]
        batches: [1, 8]
        seqlen_pairs:
          - [128, 4096]
          - [128, 5120]
          - [128, 8192]
          - [1024, 4096]
          - [1024, 5120]
          - [1024, 8192]
          - [4096, 4096]
          - [4096, 5120]
          - [4096, 8192]
          - [8192, 4096]
          - [8192, 5120]
          - [8192, 8192]
        causal: false
      - phase: holdout
        mode: dense
        head_pairs: [[16, 16], [16, 1]]
        head_dims: [64]
        batches: [2, 16]
        seqlen_pairs:
          - [384, 4608]
          - [384, 6144]
          - [384, 7168]
          - [1536, 4608]
          - [1536, 6144]
          - [1536, 7168]
          - [6144, 4608]
          - [6144, 6144]
          - [6144, 7168]
          - [12288, 4608]
          - [12288, 6144]
          - [12288, 7168]
        causal: false

